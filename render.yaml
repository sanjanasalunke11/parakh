# Render Blueprint — deploy with "New +" → "Blueprint" in the Render
# dashboard, pointing at this repo. Creates the backend web service and a
# free managed Postgres database wired together automatically.
#
# After the first deploy, fill in the secret env vars marked `sync: false`
# in the Render dashboard (Environment tab) — Render never reads secret
# values from this file, only the keys.

databases:
  - name: parakh-db
    plan: free
    databaseName: parakh
    user: parakh

services:
  - type: web
    name: parakh-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parakh-db
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: SEARCH_PROVIDER
        value: tavily
      - key: TAVILY_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: hashing
      - key: SIMILARITY_THRESHOLD
        value: "0.85"
      - key: SEMANTIC_SCAN_LIMIT
        value: "3000"
      - key: MAX_EVIDENCE_RESULTS
        value: "6"
      # Set this to your deployed Vercel frontend URL(s), comma-separated,
      # once you have it — e.g. https://parakh.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # WhatsApp (Twilio) — leave blank to run without it.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # Set to this same service's Render URL once known, e.g.
      # https://parakh-backend.onrender.com — required for Twilio webhook
      # signature verification.
      - key: PUBLIC_BASE_URL
        sync: false
